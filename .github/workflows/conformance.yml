name: conformance

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo run -p nostr_automerge_xtask --locked -- validate
      - name: Reproduce corpus report twice
        run: |
          cargo run -p nostr_automerge_conformance --locked -- run_corpus fixtures > core-profile-1.json
          cargo run -p nostr_automerge_conformance --locked -- run_corpus fixtures > core-profile-2.json
          cmp core-profile-1.json core-profile-2.json
      - uses: actions/upload-artifact@v4
        with:
          name: nostr-automerge-core-profile
          path: |
            core-profile-1.json
            core-profile-2.json
          if-no-files-found: error
